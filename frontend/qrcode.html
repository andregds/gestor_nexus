<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }

        #qrContent {
            margin: 20px 0;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #qrContent img {
            max-width: 100%;
            height: auto;
            border: 3px solid #667eea;
            border-radius: 10px;
            padding: 10px;
            background: white;
        }

        .loading {
            color: #666;
            font-size: 16px;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .success {
            color: #2ecc71;
            font-size: 18px;
            font-weight: bold;
        }

        .error {
            color: #e74c3c;
            font-size: 16px;
        }

        .instructions {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            line-height: 1.6;
        }

        .instructions ol {
            text-align: left;
            margin-top: 10px;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        #statusText {
            color: #666;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Conectar WhatsApp</h1>

        <div id="qrContent">
            <p class="loading">Carregando QR Code</p>
        </div>

        <div class="instructions">
            <strong>Como conectar:</strong>
            <ol>
                <li>Abra o WhatsApp no celular</li>
                <li>Toque em <strong>Mais opções</strong> (⋮) ou <strong>Configurações</strong></li>
                <li>Toque em <strong>Aparelhos conectados</strong></li>
                <li>Toque em <strong>Conectar um aparelho</strong></li>
                <li>Aponte a câmera para o QR Code acima</li>
            </ol>
        </div>

        <p id="statusText">Aguardando conexão...</p>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let checkInterval;

        window.addEventListener('DOMContentLoaded', () => {
            // Aguarda dados do QR Code serem passados pela janela pai
            setTimeout(() => {
                if (window.qrcodeData) {
                    displayQRCode(window.qrcodeData);
                    startStatusCheck();
                } else {
                    document.getElementById('qrContent').innerHTML =
                        '<p class="error">Erro ao carregar QR Code</p>';
                }
            }, 500);
        });

        function displayQRCode(qrcodeData) {
            const qrContent = document.getElementById('qrContent');

            // Verifica se tem base64
            if (qrcodeData.base64) {
                qrContent.innerHTML = `<img src="${qrcodeData.base64}" alt="QR Code">`;
            }
            // Ou se tem código texto
            else if (qrcodeData.code) {
                // Gera QR Code usando API pública
                const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(qrcodeData.code)}`;
                qrContent.innerHTML = `<img src="${qrUrl}" alt="QR Code">`;
            }
            else {
                qrContent.innerHTML = '<p class="error">QR Code não disponível</p>';
            }
        }

        async function startStatusCheck() {
            // Verifica status a cada 3 segundos
            checkInterval = setInterval(checkConnectionStatus, 3000);

            // Timeout de 2 minutos
            setTimeout(() => {
                if (checkInterval) {
                    clearInterval(checkInterval);
                    document.getElementById('statusText').textContent =
                        'Tempo esgotado. Feche esta janela e tente novamente.';
                }
            }, 120000);
        }

        async function checkConnectionStatus() {
            try {
                const token = localStorage.getItem('token') || window.opener.localStorage.getItem('token');

                const response = await fetch(`${API_URL}/whatsapp/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    console.error('Erro ao verificar status');
                    return;
                }

                const data = await response.json();
                console.log('🔄 Status:', data);

                if (data.connected) {
                    clearInterval(checkInterval);

                    document.getElementById('qrContent').innerHTML =
                        '<p class="success">✅ Conectado com sucesso!</p>';
                    document.getElementById('statusText').textContent =
                        'Fechando em 2 segundos...';

                    setTimeout(() => {
                        // Atualiza dashboard da janela pai
                        if (window.opener && typeof window.opener.loadUserData === 'function') {
                            window.opener.loadUserData();
                        }
                        window.close();
                    }, 2000);
                }

            } catch (error) {
                console.error('Erro ao verificar status:', error);
            }
        }

        // Limpar interval ao fechar
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
        });
    </script>
</body>
</html>
