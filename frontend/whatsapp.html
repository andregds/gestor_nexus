<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
        }
        #qrContent {
            margin: 20px 0;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        #qrContent img {
            max-width: 250px;
            height: auto;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .status-text {
            font-size: 16px;
            color: #555;
            font-weight: 500;
        }
        .loading {
            color: #667eea;
        }
        .error {
            color: #e74c3c;
        }
        .success {
            color: #27ae60;
        }
        .info {
            color: #3498db;
        }
        .btn-close {
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }
        .btn-close:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Conectar WhatsApp</h1>
        <div id="qrContent">
            <p class="status-text loading" id="statusText">Iniciando conexão...</p>
            <!-- O QR Code será inserido aqui -->
        </div>
        <button class="btn-close" onclick="window.close()">Fechar</button>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000'; // <<<<<<< AJUSTE AQUI SE SEU BACKEND ESTIVER EM OUTRA URL
        let checkInterval = null;
        let instanceName = null;
        let whatsappNumber = null;

        // Função para obter o token JWT do localStorage
        function getToken() {
            return localStorage.getItem('accessToken');
        }

        // Função para obter parâmetros da URL
        function getUrlParameter(name) {
            name = name.replace(/[|$]/, '\|$').replace(/[$|]/, '\$|');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = getToken();
            if (!token) {
                document.getElementById('statusText').textContent = 'Erro: Usuário não autenticado.';
                document.getElementById('statusText').className = 'status-text error';
                return;
            }

            whatsappNumber = getUrlParameter('number');
            if (!whatsappNumber) {
                document.getElementById('statusText').textContent = 'Erro: Número do WhatsApp não fornecido.';
                documentclassName = 'status-text loading';

            try {
                // 1. Chamar /whatsapp/connect para criar a instância
                const connectResponse = await fetch(`${API_BASE_URL}/whatsapp/connect`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ number: whatsappNumber })
                });
                const connectData = await connectResponse.json();
                console.log('Connect Response:', connectData);

                if (!connectResponse.ok || !connectData.success) {
                    document.getElementById('statusText').textContent = connectData.detail || connectData.message || 'Erro ao iniciar conexão.';
                    document.getElementById('statusText').className = 'status-text error';
                    return;
                }

                instanceName = connectData.instance_name;
                document.getElementById('statusText').textContent = connectData.message || 'Instância criada. Aguardando QR Code...';
                document.getElementById('statusText').className = 'status-text info';

                // Inicia o polling para o status
                startPolling();

            } catch (error) {
                console.error('Erro ao conectar WhatsApp:', error);
                document.getElementById('statusText').textContent = 'Erro de rede ou servidor ao conectar.';
                document.getElementById('statusText').className = 'status-text error';
            }
        });

        function startPolling() {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
            // Chama imediatamente e depois a cada 3 segundos
            fetchStatus();
            checkInterval = setInterval(fetchStatus, 3000);
        }

        async function fetchStatus() {
            if (!instanceName) {
                document.getElementById('statusText').textContent = 'Erro: Nome da instância não disponível.';
                document.getElementById('statusText').className = 'status-text error';
                clearInterval(checkInterval);
                return;
            }

            const token = getToken();
            try {
                // 2. Chamar /whatsapp/status para obter o QR Code e o estado
                const response = await fetch(`${API_BASE_URL}/whatsapp/status`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                console.log('Status Polling Data:', data);

                const qrContentDiv = document.getElementById('qrContent');
                const statusTextP = document.getElementById('statusText');

                if (!response.ok) {
                    statusTextP.textContent = data.detail || data.message || 'Erro ao obter status.';
                    statusTextP.className = 'status-text error';
                    qrContentDiv.innerHTML = `<p class="status-text error">${statusTextP.textContent}</p>`;
                    clearInterval(checkInterval);
                    return;
                }

                const { connected, qr_code, state, message } = data;

                if (connected) {
                    statusTextP.textContent = '✅ Conectado com sucesso!';
                    statusTextP.className = 'status-text success';
                    qrContentDiv.innerHTML = `<p class="status-text success">✅ Conectado com sucesso!</p>`;
                    clearInterval(checkInterval);

                    // Atualiza dashboard da janela pai e fecha o popup
                    if (window.opener && typeof window.opener.loadUserData === 'function') {
                        window.opener.loadUserData();
                    }
                    setTimeout(() => { window.close(); }, 2000); // Fecha após 2 segundos
                } else if (qr_code) {
                    statusTextP.textContent = message || `📱 Escaneie o QR Code para conectar (Estado: ${state}).`;
                    statusTextP.className = 'status-text info';
                    qrContentDiv.innerHTML = `<img src="${qr_code}" alt="QR Code WhatsApp"><p class="status-text info">${statusTextP.textContent}</p>`;
                } else {
                    statusTextP.textContent = message || `⏳ Aguardando QR Code... (Estado: ${state}).`;
                    statusTextP.className = 'status-text loading';
                    qrContentDiv.innerHTML = `<p class="status-text loading">${statusTextP.textContent}</p>`;
                }

            } catch (error) {
                console.error('Erro no polling de status:', error);
                document.getElementById('statusText').textContent = 'Erro de rede ou servidor ao verificar status.';
                document.getElementById('statusText').className = 'status-text error';
                clearInterval(checkInterval);
            }
        }

        // Limpar interval ao fechar
        window.addEventListener('beforeunload', () => {
            if (checkInterval) {
                clearInterval(checkInterval);
            }
        });
    </script>
</body>
</html>
