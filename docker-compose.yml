version: '3.8'

services:
  backend:
    build: ./backend
    container_name: nexus_backend
    restart: always
    volumes:
      - ./backend/sessions:/app/sessions # Persistir sessões do WhatsApp
      - ./backend/monitor_dns.db:/app/monitor_dns.db # Persistir Banco SQLite
      - ./backend/.env:/app/.env # Usar o .env local
    environment:
      - TZ=America/Sao_Paulo
    networks:
      - nexus_net

  frontend:
    build: ./frontend
    container_name: nexus_frontend
    restart: always
    ports:
      # Alterado de "80:80" para "8050:80"
      # O primeiro número é a porta do HOST (seu servidor/PC)
      # O segundo número é a porta do CONTAINER (Nginx interno)
      - "8050:80"
      # Se for configurar SSL no futuro, altere a porta do host também (ex: "8443:443")
      # - "443:443"
    volumes:
        - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
        - /etc/letsencrypt/live/painel.gestornexus.com.br/fullchain.pem:/etc/nginx/certs/fullchain.pem
        - /etc/letsencrypt/live/painel.gestornexus.com.br/privkey.pem:/etc/nginx/certs/privkey.pem

    depends_on:
      - backend
    networks:
      - nexus_net

networks:
  nexus_net:
    driver: bridge